name: Build and deploy Study Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and build study data
        run: python tools/build_study_data.py

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten

      - name: Compile C++ adaptive engine to WebAssembly
        run: |
          emcc cpp/adaptive_engine.cpp -O3 \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS='["_adaptive_weight","_mastery_score"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -o engine.js

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js enhanced.js engine.js engine.wasm _site/
          cp -R generated _site/generated
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
